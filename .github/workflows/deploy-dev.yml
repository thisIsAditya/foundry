name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: foundry-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/foundry-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register task definition, migrate, update service
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          PREFIX=/foundry/dev
          CLUSTER=$(aws ssm get-parameter --name "$PREFIX/ecs-cluster-name" --query Parameter.Value --output text)
          SERVICE=$(aws ssm get-parameter --name "$PREFIX/web-service-name" --query Parameter.Value --output text)
          FAMILY=$(aws ssm get-parameter --name "$PREFIX/web-task-family" --query Parameter.Value --output text)
          CONTAINER=$(aws ssm get-parameter --name "$PREFIX/web-container-name" --query Parameter.Value --output text)
          SUBNETS=$(aws ssm get-parameter --name "$PREFIX/private-subnet-ids" --query Parameter.Value --output text)
          SG=$(aws ssm get-parameter --name "$PREFIX/web-task-sg-id" --query Parameter.Value --output text)
          DOMAIN=$(aws ssm get-parameter --name "$PREFIX/cloudfront-domain" --query Parameter.Value --output text)

          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition)
          echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE" '
            .containerDefinitions |= map(if .name == "web" then .image = $IMAGE else . end) |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt,
              .tags
            )
          ' > /tmp/taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/taskdef.json --query taskDefinition.taskDefinitionArn --output text)

          NETWORK="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=DISABLED}"
          OVERRIDE=$(jq -nc --arg name "$CONTAINER" '{containerOverrides:[{name:$name,command:["node","migrate/dist/migrate-cli.js"]}]}')
          MIGRATE_TASK=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$NEW_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDE" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$MIGRATE_TASK"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$MIGRATE_TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "migration task failed with exit code $EXIT_CODE"
            exit 1
          fi

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

          for _ in $(seq 1 30); do
            if curl -fsS "https://${DOMAIN}/api/ready"; then
              exit 0
            fi
            sleep 10
          done
          echo "smoke check failed for https://${DOMAIN}/api/ready"
          exit 1
