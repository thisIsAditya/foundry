services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./docker/postgres/02-create-test-db.sh:/docker-entrypoint-initdb.d/02-create-test-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foundry -d foundry']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foundry
      MINIO_ROOT_PASSWORD: foundryfoundry
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 foundry foundryfoundry; do sleep 1; done
        mc mb -p local/foundry-uploads
        mc anonymous set none local/foundry-uploads

  clamav:
    profiles: ['clamav']
    image: clamav/clamav:1.4
    ports:
      - '3310:3310'

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '3210:3210'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://foundry:foundry@postgres:5432/foundry
      REDIS_URL: redis://valkey:6379
      BETTER_AUTH_URL: http://localhost:3210
      BETTER_AUTH_SECRET: replace-with-at-least-32-characters
      AWS_REGION: ap-south-1
      AWS_S3_UPLOADS_BUCKET: foundry-uploads
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: 'true'
      AWS_ACCESS_KEY_ID: foundry
      AWS_SECRET_ACCESS_KEY: foundryfoundry
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    ports:
      - '8689:8689'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://foundry:foundry@postgres:5432/foundry
      REDIS_URL: redis://valkey:6379
      AWS_REGION: ap-south-1
      AWS_S3_UPLOADS_BUCKET: foundry-uploads
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: 'true'
      AWS_ACCESS_KEY_ID: foundry
      AWS_SECRET_ACCESS_KEY: foundryfoundry
      FOUNDRY_SECRETS_KEY: ${FOUNDRY_SECRETS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  valkey_data:
  minio_data:
